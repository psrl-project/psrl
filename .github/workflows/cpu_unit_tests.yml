name: cpu_unit_tests

on:
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/cpu_unit_tests.yml"
  push:
    branches: [main, base_agentic_rl]
    paths:
      - "**/*.py"
      - ".github/workflows/cpu_unit_tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cpu_unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install psrl with test dependencies
        run: |
          pip install --no-deps -e .
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-mock>=3.12" "pytest-cov>=5.0" aiohttp cachetools numpy omegaconf
      - name: Run cpu_test suite
        run: |
          pytest -m cpu_test \
            --cov=psrl \
            --cov-report=xml \
            tests/staleness/test_staleness_controller.py \
            tests/elastic_rm/test_scaling_policy_instance_id.py
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
