default_language_version:
  python: python3

default_install_hook_types:
  - pre-commit
  - commit-msg

ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [--output-format, github, --fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prose-style
        name: audit prose style
        entry: python scripts/audit_prose_style.py
        language: system
        files: ^(?:(?:psrl|tests|unit_tests|examples|scripts|hydra_plugins|\.github)/.*\.(?:py|sh|ya?ml|jinja2?|toml)|setup\.py|pyproject\.toml|\.pre-commit-config\.yaml)$
