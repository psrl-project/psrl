# `trajectory` treats each trajectory independently.
# `request` keeps sibling trajectories in one optimizer step.
batch_agg_mode: trajectory

# How a harness that drops `reasoning_content` on replay is handled.
# `multi_traj` trains every fork, `longest_traj` keeps the deepest one.
# `multi_thinking` keeps CoT inline and requires rollout.chat_template to be an
# accumulating template. `disable_thinking` turns CoT off and forbids that override,
# because an accumulating template renders an unterminated `<think>` without CoT.
thinking_template: multi_traj

# How many rollout groups may fail back to back, with none succeeding in between,
# before training aborts. Each failure is replaced by a fresh prompt, so a
# deterministic fault (unreachable registry, broken task image) otherwise churns
# refills forever at zero progress instead of failing. Any group that completes
# resets the count, so sporadic failures never accumulate into a trip.
refill_failure_threshold: 32

# Per-trajectory text dump written by all agent loops via TrajectoryWriter.
# Files land at <dir>/v{version}/{uid}.txt (one per rollout trajectory).
trajectory_output:
  # Whether to write per-trajectory text files.
  enable: True
  # Output directory. Empty -> <psrl.logging_path>/trajectories.
  dir: ""

# Write each session turn immediately so diagnostics survive unfinished trajectories.
turn_output:
  # Whether to record raw session chat-completion traffic.
  enable: False
  # Output directory. Empty -> <psrl.logging_path>/session_turns.
  dir: ""
  # Whether to include the response body (roughly doubles the file size).
  include_response: True

