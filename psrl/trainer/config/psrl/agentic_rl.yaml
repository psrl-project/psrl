# `trajectory` treats each trajectory independently.
# `request` keeps sibling trajectories in one optimizer step.
batch_agg_mode: trajectory

# How a harness that drops `reasoning_content` on replay is handled: `multi_traj` trains every
# fork, `longest_traj` the deepest, `multi_thinking` keeps CoT inline, `disable_thinking` off.
thinking_template: multi_traj

# Consecutive rollout groups that may fail with no success before training aborts. A member
# failure is first repaired in place; only a member whose retries are exhausted replaces its
# whole group with a fresh prompt, and any success resets the count.
refill_failure_threshold: 32

# In-place retries a single failed training child gets before its group is replaced. The refill
# keeps the same parent and child id, so the siblings keep their completed work and their
# sandboxes; a task that kills every sandbox it runs in still falls back to a fresh group.
train_member_retry_limit: 3

# Consecutive groups that may be lost to node capacity admission before training aborts. Each
# attempt waits for capacity until the sandbox service refuses it, and its replacement waits
# again, so an exhausted node would otherwise refill forever while the buffer never fills. Set
# to 0 to wait indefinitely.
capacity_failure_threshold: 4

# Attempts each validation prompt gets before the round drops it and reports accuracy over a
# smaller set. A validation prompt is a fixed member of the evaluation set, so losing one to an
# infrastructure fault changes what the metric was measured over; retrying the same prompt is
# what keeps accuracy comparable across steps. Only coordination faults and transient errors are
# retried. 1 means a single attempt, and raising it holds the round's prompts in memory so a
# retry re-runs the identical task rather than a substitute.
val_retry_limit: 1

# Seconds between progress lines while the driver waits for an incomplete buffer.
buffer_wait_log_interval_s: 60

# Per-trajectory text dump written by all agent loops via TrajectoryWriter.
# Files land at <dir>/v{version}/{uid}.txt (one per rollout trajectory).
trajectory_output:
  # Whether to write per-trajectory text files.
  enable: True
  # Output directory. Empty -> <psrl.logging_path>/trajectories.
  dir: ""

# Write each session turn immediately so diagnostics survive unfinished trajectories.
turn_output:
  # Whether to record raw session chat-completion traffic.
  enable: False
  # Output directory. Empty -> <psrl.logging_path>/session_turns.
  dir: ""
  # Whether to include the response body (roughly doubles the file size).
  include_response: True

# Subagent trajectory selection and capture. The SessionRouter stores this policy in
# the TITO session; extraction reads it from the snapshot rather than from the current
# trainer config, so a policy change never rewrites an in-flight episode.
subagent_training:
  # off: no trajectory trains (diagnostic only).
  # main_only: only the parent agent trains; subagents keep token ids for replay.
  # all: the parent and every subagent train.
  # selected: the parent plus matching `train_agents` entries train.
  mode: main_only
  # Exact agent ids or glob patterns, used by `selected`.
  train_agents: []
  # owner: every node an agent owns is trained, including a node another trajectory
  # also replays. context: only nodes unique to the agent train (diagnostic).
  shared_prefix: owner
  # session: one reward broadcasts to every trainable row of the session.
  reward: session
  loss_weight:
    main: 1.0
    subagent: 1.0
  # Fail a trainable row whose capture is token-only instead of silently training a
  # fraction of it. Validation always captures tokens and is exempt.
  require_primary_capture: true
  # Validation scoring may use a different selection. Validation never trains.
  val_mode: main_only

