# `trajectory` treats each trajectory independently.
# `request` keeps sibling trajectories in one optimizer step.
batch_agg_mode: trajectory

# `multi_traj` trains all forks, `longest_traj` keeps the deepest. `multi_thinking` needs an accumulating chat template.
# `disable_thinking` forbids that override because it leaves `<think>` unclosed when CoT is off.
thinking_template: multi_traj

# Abort after this many consecutive failed rollout groups. Each failure refills from a fresh prompt.
# Any completed group resets the counter, so intermittent failures do not accumulate.
refill_failure_threshold: 32

# Per-trajectory text dump written by all agent loops via TrajectoryWriter.
# Files land at <dir>/v{version}/{uid}.txt (one per rollout trajectory).
trajectory_output:
  # Whether to write per-trajectory text files.
  enable: True
  # Output directory. Empty -> <psrl.logging_path>/trajectories.
  dir: ""

# Write each session turn immediately so diagnostics survive unfinished trajectories.
turn_output:
  # Whether to record raw session chat-completion traffic.
  enable: False
  # Output directory. Empty -> <psrl.logging_path>/session_turns.
  dir: ""
  # Whether to include the response body (roughly doubles the file size).
  include_response: True

