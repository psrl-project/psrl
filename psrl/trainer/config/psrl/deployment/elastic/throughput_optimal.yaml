# ITL/F/L policy parameters. A/B/C/D follow:
#   ITL = A * total_token_num + max(B, C * running_queue_num) + D
# `migrate_time_s_initial` seeds the first decision. Later decisions use an
# EWMA of observed SLEEP + WAKE_UP time from ElasticExecutor.
decision_window_s: 60.0
migrate_time_s_initial: 5.0
migrate_time_ewma_alpha: 0.2
min_gain: 0.05
# Experimental request-snapshot evaluator. False preserves candidate
# scoring and the existing post-scale-up rebalance path byte-for-byte.
enable_request_level_candidate_evaluation: true
# Skip all post-scale-up ABORT when false, including the older ratio-based
# waiting-queue interrupt used when request-level evaluation is off.
rebalance_after_scale_up: true
# When enabled, pause normal router dispatch while a request-level
# rebalance is active. Interrupted requests are redispatched FIFO to the
# destinations chosen by candidate simulation, bypassing normal routing
# admission and ranking rules.
exclusive_rebalance_migration_queue: false
candidate_evaluation_max_workers: 64
# Candidate simulation implementation: python or cpp. The C++ backend
# keeps one JSONL evaluator process alive for the policy lifetime.
candidate_evaluation_backend: python
# null resolves to build/elastic_simulator/elastic_simulator under the
# repository root. An explicit path may be used for packaged binaries.
candidate_evaluation_cpp_binary: null
candidate_evaluation_cpp_timeout_s: 30.0
# False uses the standard harmonic denominator sum.
# true uses max(w_rollout / rollout_tp, w_rm / rm_tp).
harmonic_denominator_use_max: false
# Objective mode:
# - balanced_min: estimate each role from its balanced average instance load.
# - sum: sum per-instance throughput within each role.
throughput_objective: sum
# Which vLLM queues are counted as current instance load in ITL/F estimates.
# - running_waiting: use vLLM running + vLLM waiting (legacy behavior).
# - running: use only vLLM running; router waiting top-T is still counted separately below.
vllm_current_queue_scope: running
# Max number of same-role instances a single ITL decision may wake or sleep.
# 1 keeps the original one-step candidate search.
# -1 disables the per-action cap (still bounded by available instances).
max_scale_instances_per_action: -1
# Enable GPU-bundle-aware wake plans when rollout and RM replicas use
# different power-of-two parallel sizes. Equal-size roles retain the
# established count-prefix candidate path even when this is true.
enable_heterogeneous_parallelism_candidates: false
# Number of leading router waiting sequences to include in ITL F/F' estimates.
# -1 includes all router waiting requests; 0 disables router-waiting load in the objective.
router_waiting_top_t: -1
# Whether current-state F includes router waiting load distributed over awake instances.
current_state_include_router_waiting: false
# Per-role throughput weighting by router + in-instance pressure.
# When enabled, system throughput becomes
#   (w_rollout + w_rm) / (w_rollout / rollout_tp + w_rm / rm_tp)
# Pressure includes in-instance running/waiting load and router backlog.
role_throughput_weight_enable: true
# Pressure basis for the divisors above:
# - request_count: weight by per-role total request count.
# - token_count:   weight by per-role total token count.
# - none:          disable weighting even if role_throughput_weight_enable is true.
role_throughput_weight_basis: request_count
# How pressure is turned into the per-role throughput divisor:
# - share (default): w_role = role_pressure / (rollout_pressure + rm_pressure)
#     (normalized share summing to 1; uniform 0.5/0.5 when both sides idle).
# - raw:             w_role = role's raw pressure value (its request count or
#     token count) directly; heavier pressure penalizes the side far more
#     aggressively. A side with zero pressure falls back to divisor 1.0.
role_throughput_weight_mode: raw
# JSON file, or a directory of {model_stem}.json files. Stem is derived from the model name.
# Independent of psrl.rollout_coordination.routing_strategy.cost_model_path.
cost_model_path: psrl/trainer/config/cost_model
model_params: {}
rm_router_enable: true
# Optional stop-routing threshold: if ITL(load + 1) for every available
# RM worker is above this value, keep requests in the router queue.
# null means no ITL threshold.
rm_router_max_itl: null

# After scale-up, rebalance by ABORTing selected donor-side requests so the router
# can place them on newly-awakened instances. Donor score =
# request_weight * over_request_ratio + length_weight * over_length_ratio.
post_scale_up_rebalance_request_weight: 0.6
post_scale_up_rebalance_length_weight: 0.4

# EWMA alpha for arrival rate estimation
lambda_ewma_alpha: 0.2
