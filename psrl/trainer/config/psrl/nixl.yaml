# NIXL config for `nixl_cpu` weight synchronization

# Server IP address
server_ip: ${psrl.ps_manager_ip}

# Server port
server_port: 23456

# Wire format the trainer publishes for the rollout. This is the transport format that
# the publisher produces and both rollout roles load, not veRL's trainer-side QAT path.
weight_quantization:
  # none | fp8. mxfp8, nvfp4 and compressed_tensors are recognized and rejected until
  # their publisher and engine paths land.
  scheme: none
  # Quantization tile on the last two dimensions. null selects the scheme default.
  block: null
  # Compressed-tensors options, reserved for the later phases.
  preset: null
  ignore: []
  config_file: null

# Quantize in the reader instead of the trainer. The trainer keeps its live BF16
# parameters and allocates no publish copy; each rollout stages the BF16 shard and
# writes its own FP8 parameters and `_scale_inv`. Only valid for Megatron direct
# supply with weight_quantization.scheme=fp8. Peer diffusion shares a quantized
# shard across readers at the individual finest-mesh shard, including readers whose
# target layout differs (one TP/EP degree's shard overlapping another's). See
# docs/design/reader_quantization_impl.md.
reader_quantization: false

# Pinned temp memory slots num for non-contiguous transfer
max_pinned_temp_memory_slots: 16

# Enable TMS management for NIXL temp buffers
enable_tms_for_temp_buffers: ${psrl.tms.enable_nixl}

# Per-shard weight version stamps (3.4 "版本相等性").
#
# Direct supply removes the PS as the place to ask "which version is this", so the stamp
# travels with the shard. The checks are metadata-only -- O(1) per shard, independent of
# model size, dtype and quantisation -- which is why they are on rather than opt-in:
# measured 0.06 ms per publish for an 8B model, against ~61 s to hash its contents.
#
# They catch stale, torn and misdirected reads. They do not catch bit corruption of
# correctly-versioned bytes, which the NIC already checksums.

# How long each NIXL handshake phase waits for its clients, in seconds.
#
# Startup, not transport: the clock starts when the meta server begins waiting and the
# clients are still bringing vLLM up behind it. Measured on a 5-node Qwen3-8B run,
# reaching the handshake took 18.6 min once and 23.5 min the next time -- same code, same
# cluster -- so a budget tight enough to fit the first loses the second to a run that was
# working. Raise it on slow or contended clusters; a handshake that is genuinely broken
# fails on its own, not by waiting longer.
handshake_timeout_s: 1800

# Whether same node rollouts with identical shards share one upstream read per key and
# read the rest from each other over NVLink. Cuts trainer egress to one copy per node.
peer_diffusion: True

# Bytes of the rollout side staging pool, split into two alternating slots. Shards whose
# local layout is fragmented are read into it and scattered locally.
pull_staging_bytes: 268435456

# How long a rollout waits for its designate before reading that designate's keys upstream.
peer_timeout_s: 120

# Upstream waves per pull. Followers read wave w over NVLink while wave w + 1 crosses the NIC.
pull_waves: 4

# How long one wave's reads may run before their sources are treated as failed and their keys
# re-read from a DP replica. Must exceed the time to move one wave at the slowest tolerable rate.
read_timeout_s: 300

# MiB a train rank may spend on contiguous copies of shards that rollouts cut finer than it does.
# Each copy turns a read of one descriptor per row into one descriptor. Past the budget rollouts
# span read the shard instead, which moves more bytes. null is unbounded.
publish_copy_budget_mb: null

# Resolved by `validate_config` under direct supply: the dtype the trainer stores and the one
# the rollout loads. When they differ the trainer publishes contiguous copies cast to the latter.
publish_train_dtype: null
publish_rollout_dtype: null
# Resolved by `validate_config`: the serialized plan every participant rebuilds.
publish_quantization: null

# Registration granularity for CUDA memory.
#
# NIXL registration costs roughly a fixed budget per region (~30 ms on H20), and a
# vLLM instance holds one allocation per weight (plus one per FP8 scale), so a wake
# that re-registers it is dominated by region count. Registering the containing CUDA
# allocator segment once, instead of each allocation, keeps the same memory and the
# same zero-copy data path. `auto` enables it unless expandable segments are in use
# (their VA range is mapped on demand and must not be registered whole); tensors the
# snapshot cannot place fall back to per-allocation registration. `off` restores the
# per-allocation behaviour.
segment_registration: auto

# Whether publishing waits for readers of the previous version to drain (item E1).
#
# `auto` means "decide from the backend and precision"; `validate_config` replaces it and
# the resolved boolean is what a dumped config shows. Set it to an explicit true/false to
# override -- which is what the E1 criterion needs, since observing weight corruption by
# turning the barrier *off* is the only way to show the barrier is doing anything.
#
# Needed when publishing overwrites memory a rollout may be reading. Under FSDP2 at
# matched precision that is the whole optimizer step, because there are no master
# parameters -- the live weights *are* what gets written. On a cast path the rollout reads
# a separate quantised buffer, and under colocate rollout is paused for the duration, so
# both are structurally safe and this stays False.
await_readers_before_publish: auto

# v2 write gate: optimistic commit validation for pulls against in-place optimizer writes.
#
# When enabled, the trainer closes the version before its first optimizer parameter write,
# preempts in-flight readers with a control notification, and records `write_epoch`. A pull
# may commit only if the epoch did not move during it, or if it acknowledged before the
# write and repaired its unfinished keys from same-node holders of the same version. The
# writer waits at most `preempt_ack_timeout_ms` (a notification round trip, not a drain),
# so a slow reader cannot stall training.
#
# `auto` enables it where rollouts read the trainer's live parameter bytes: direct supply
# at matched precision. Cast/FP8 rollouts read a separate published copy and PS modes read
# PS memory, so both resolve to False. Explicit booleans override for fault injection.
await_write_gate: auto
# Bound on how long the optimizer waits for readers to record the preemption boundary.
# Acknowledgements only need a control-plane round trip; the data read is invalidated,
# not drained.
preempt_ack_timeout_ms: 100

# How long a reader waits for the next version after its pull was preempted and could not
# be repaired from holders. It must cover one training step; the reader stays paused until
# a complete version lands.
preempt_repull_timeout_s: 600

# Bound on waiting for an update fan-out to be acknowledged. Updates are sent from every
# train rank's agent (the fan-out width scales with training parallelism); if a
# notification lands nowhere, the same update is re-sent through the meta server, which
# has every destination loaded. Without a bound a lost notification stalls the switch
# until the handshake budget expires.
fanout_ack_timeout_ms: 10000

# How long that wait may last, in milliseconds.
#
# Bounded on purpose: a budget that can reach a step's duration would delay every publish
# to close a race that lasts microseconds. Past the budget the publish proceeds and the
# previous version is marked invalid, which readers observe through
# `PSManager.get_nixl_version_state` and answer by re-pulling the newer version -- a
# strictly better model, so the fallback is an algorithmic improvement rather than a stall.
#
# It bounds the trainer's stall, not the reader's window. The race itself lasts one
# write-back under Megatron, but the whole optimizer step under FSDP2 at matched precision,
# which is far longer than this: there the budget will usually expire, the version is
# invalidated, and recovery is the reader-side re-pull. Size it from the write-back window,
# not from a pull, when tuning.
conflict_wait_budget_ms: 50.0

# How many whole pulls a rollout may attempt within one sync before giving up.
#
# Each attempt re-reads the version state and transfers every key, so a retry costs one
# full sync (35 ms for an 8B model on one node, 2.4 s for 235B across two). Attempts exist
# for two cases that both mean the previous read cannot be served: shards from more than one
# version, or a version the publisher declared invalid while it was being read. Exhausting
# the bound raises, because the instance holds mixed bytes and generating from them is worse
# than staying out of service for one sync.
max_pull_attempts: 3
# Merge all contiguous shards of a key into a single NIXL request per (op, target, key).
# Disable to fall back to one NIXL request per shard.
merge_contiguous_xfer: true

# Cache prepared descriptor lists (`prep_xfer_dlist` + `make_prepped_xfer`) to avoid
# re-preparing unchanged descriptors on every transfer.
enable_prepared_dlist: true

# Capture NIXL agent telemetry. Requires NIXL_TELEMETRY_ENABLE=true in the environment.
capture_telemetry: false

# Log per-transfer NIXL telemetry (bytes, post/xfer durations) on completion.
enable_nixl_telemetry: false
