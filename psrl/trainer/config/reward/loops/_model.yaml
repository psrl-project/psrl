defaults:
  - /model@model: hf_model
  - /rollout@rollout: psrl_rollout
  - _self_

# Each instance supplies its model identity and checkpoint path.
reward_model_name: ???

enable_resource_pool: True
n_gpus_per_node: 4
num_replicas: 4
nnodes: 1
rollout_ngpus_per_instance_per_node: 1
rollout_nnodes_per_instance: 1
max_concurrent_requests_per_instance: null

model:
  path: null
  external_lib: ${oc.select:train_actor_rollout_ref.model.external_lib,null}
  trust_remote_code: False

rollout:
  gpu_memory_utilization: 0.7
  enforce_eager: true
  tensor_model_parallel_size: 1
  max_num_batched_tokens: 204800
  max_num_seqs: 1024
  load_format: auto
  enable_chunked_prefill: false
  enable_prefix_caching: false
  # One-shot scoring does not reuse KV cache.
  disable_kv_cache: true
  skip_tokenizer_init: false
  n: 1
  prompt_length: 16384
  response_length: 16384
  max_model_len: 32768
  enable_weights_cpu_backup: True

sampling_config:
  temperature: 1.0
  top_p: -1
  top_k: 1
