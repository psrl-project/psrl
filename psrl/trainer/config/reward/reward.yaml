# Load another loop with `+reward/loops@reward.reward_loops.<alias>=<preset>`.
defaults:
  - /reward/loops@reward_loops.dapo: dapo
  - /reward/loops@reward_loops.naive: naive
  - /reward/loops@reward_loops.opd: opd
  - /reward/loops@reward_loops.llm_as_a_judge: llm_as_a_judge
  - /reward/loops@reward_loops.gen_qwen3_8b: gen_qwen3_8b
  - /reward/loops@reward_loops.gen_skywork: gen_skywork
  - /reward/loops@reward_loops.sandbox: sandbox
  - _self_

# whether to launch the reward function asynchronously
launch_reward_fn_async: True

# way to normalize the reward, choices: group, batch, none
reward_normalization: null

# Training reward worker pool.
reward_loop_worker:
  num_workers: 8
  max_concurrency_per_worker: 256
  queue_size_per_worker: 4096
  placement: reward_service_ip
  result_queue_size: 65536
  result_drain_batch_size: 1024
  heartbeat_interval_s: 30
  shutdown_timeout_s: 10

# Validation owns separate workers, submission capacity, and result queues.
validation_reward_loop_worker:
  num_workers: 2
  max_concurrency_per_worker: 256
  queue_size_per_worker: 4096
  placement: reward_service_ip
  result_queue_size: 65536
  result_drain_batch_size: 1024

# Only listed loops are active at runtime.
active_loops:
  - naive
