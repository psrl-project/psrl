[build-system]
requires = [
    "packaging",
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "psrl"
version = "0.0.1"
description = "PSRL is a post-training framework for LLMs that supports both synchronous and asynchronous training paradigms through staleness control, streaming rollout and parameter server architecture."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.9.0",
    "cachetools>=5.0.0",
    "vllm-psrl-patches",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]


[project.optional-dependencies]
grpc = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]
sandbox-e2b = [
    "e2b>=2.38.0",
]

[project.urls]
Homepage="https://github.com/psrl-project/psrl"

[tool.uv.sources]
vllm-psrl-patches = { path = "patch/vllm/vllm_plugin", editable = true }

[tool.setuptools]
package-dir = {"" = "."}
packages = ["psrl"]
include-package-data = true

[tool.setuptools.package-data]
psrl = [
    "trainer/config/*.yaml",
    "trainer/config/**/*.yaml",
    "eval/config/*.yaml",
    "eval/config/**/*.yaml",
]

[project.entry-points."hydra.searchpath"]
psrl = "psrl.trainer.config.hydra_plugins.psrl_searchpath:PSRLSearchPathPlugin"

[tool.ruff]
line-length = 119
src = ["psrl"]
extend-exclude = [
    # Archived pre-SMG code kept for reference only. It is never imported by live code.
    "deprecated",
    # Vendored upstream parsers: copied verbatim and hashed in _vendor/PROVENANCE.md.
    # Reformatting them would trip the payload integrity check in payload.py.
    "examples/mini_swe/grading/_vendor",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
# --pyargs removed: incompatible with filesystem-based discovery under tests/
asyncio_mode = "auto"
addopts = "--verbose --durations=0 --strict-markers"
testpaths = ["tests"]
norecursedirs = [
    "external", "examples", "docs", "scripts", "tools",
    "tutorials", "*.egg", ".*", "_darcs", "build",
    "CVS", "dist", "venv", "{arch}",
]
markers = [
    "cpu_test: marks tests that run on CPU only (no GPU, no Ray cluster required)",
    "unit: marks unit test (single, well isolated functionality)",
    "integration: marks test checking integrated subsystems",
    "system: marks test at the highest integration level",
    "acceptance: marks test checking user-defined acceptance criteria",
    "docs: marks tests related to documentation",
    "skipduringci: marks tests skipped in CI but useful for user setups",
    "pleasefixme: marks tests that are broken and need fixing",
]
